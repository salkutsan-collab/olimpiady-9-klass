<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Петербургский олимпиадный сезон</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F5F6F9; --surface:#FFFFFF; --line:#DDE1EA;
  --ink:#141922; --ink-2:#4B5462; --ink-3:#727C8C;
  --accent:#1E4B8F; --brick:#9E3F26;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111419; --surface:#181C23; --line:#2C323C;
    --ink:#E6E9F0; --ink-2:#A5AEBC; --ink-3:#818B9A;
    --accent:#86ADE9; --brick:#DE9077;
  }
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  line-height:1.6;
}
.gate{
  width:100%; max-width:380px;
  background:var(--surface);
  border:1px solid var(--line);
  padding:32px 30px 28px;
}
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 12px;
}
h1{
  font-family:Newsreader,Georgia,serif; font-weight:600;
  font-size:27px; line-height:1.12; letter-spacing:-.015em;
  margin:0 0 10px; text-wrap:balance;
}
.sub{font-size:14px; color:var(--ink-2); margin:0 0 24px}
label{
  display:block;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:6px;
}
input{
  width:100%; padding:10px 12px; margin-bottom:16px;
  font-family:inherit; font-size:15px;
  color:var(--ink); background:var(--ground);
  border:1px solid var(--line); border-radius:2px;
}
input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent)}
button{
  width:100%; padding:11px 14px;
  font-family:inherit; font-size:15px; font-weight:500;
  color:var(--surface); background:var(--accent);
  border:1px solid var(--accent); border-radius:2px; cursor:pointer;
}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.6; cursor:default}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.msg{min-height:20px; margin:14px 0 0; font-size:13.5px; color:var(--brick)}
.hint{margin:20px 0 0; font-size:12.5px; color:var(--ink-3); line-height:1.5}
</style>
</head>
<body>
<main class="gate">
  <p class="eyebrow">Доступ по паролю</p>
  <h1>Петербургский олимпиадный сезон</h1>
  <p class="sub">Справочник по олимпиадам для 9 класса. Введите логин и пароль.</p>
  <form id="f" autocomplete="off">
    <label for="u">Логин</label>
    <input id="u" name="u" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label for="p">Пароль</label>
    <input id="p" name="p" type="password" required>
    <button id="b" type="submit">Открыть</button>
  </form>
  <p class="msg" id="m" role="status" aria-live="polite"></p>
  <p class="hint">Текст страницы зашифрован в браузере. Без верного пароля прочитать его нельзя даже из исходного кода.</p>
</main>

const ITER = 250000;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const f = document.getElementById('f');
const m = document.getElementById('m');
const b = document.getElementById('b');

f.addEventListener('submit', async e => {
  e.preventDefault();
  const login = document.getElementById('u').value.trim();
  const pass  = document.getElementById('p').value;
  if (!login || !pass) return;

  if (!window.crypto || !window.crypto.subtle) {
    m.textContent = 'Браузер не дает расшифровать страницу: нужен https или localhost.';
    return;
  }

  b.disabled = true;
  m.textContent = 'Проверяем...';
  try {
    const base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(login + ':' + pass), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64(IV) }, key, b64(DATA)
    );
    const html = new TextDecoder().decode(plain);
    document.open();
    document.write('<!doctype html><html lang="ru">' + html + '</html>');
    document.close();
  } catch (err) {
    b.disabled = false;
    m.textContent = 'Логин или пароль не подходят.';
    document.getElementById('p').value = '';
    document.getElementById('p').focus();
  }
});
</script>

</html>
